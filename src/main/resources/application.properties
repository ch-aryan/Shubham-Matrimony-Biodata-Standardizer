spring.application.name=Shubham_matrimony_Biodata

# Gemini API Configuration
gemini.api.enabled=true
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.timeout-seconds=30
gemini.api.max-retries=2

# Gemini Routing Configuration
gemini.routing.min-fields-threshold=8
gemini.routing.always-call-if-unparsed=true
gemini.routing.always-call-if-conflict=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

